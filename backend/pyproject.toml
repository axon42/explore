[project]
name = "meeting-transcript"
version = "0.1.0"
description = "Local meeting transcript ingestion and replay"
requires-python = ">=3.12"
dependencies = ["anyio>=4.0", "fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic>=2.10", "pydantic-settings>=2.8", "websockets>=15"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11", "pytest-asyncio>=0.25"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
